---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "kind/dependabot"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    labels:
      - "kind/dependabot"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
    security-updates-only: true
    target-branch: release-0.1
    labels:
      - dependencies
      - security
